# Alembic configuration for VoxSearch (Goal 06).
#
# SECURITY: the database URL is deliberately NOT stored here. ``env.py`` obtains
# it at runtime from the existing application settings
# (``app.core.config.get_settings().database_url``, a pydantic ``SecretStr``),
# so credentials never live in version control and are never written to logs.
# ``sqlalchemy.url`` is intentionally left empty.
#
# Run all alembic commands from the backend/ directory using backend/.venv, e.g.:
#   .\.venv\Scripts\python.exe -m alembic upgrade head
#   .\.venv\Scripts\python.exe -m alembic current

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Template used when generating new revision files via `alembic revision`.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

# Logging configuration. sqlalchemy.engine is kept at WARN so no SQL (and no
# connection string) is echoed during migration runs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
