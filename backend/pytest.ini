[pytest]
# Make the backend/ directory importable so `import app.*` resolves when
# running `pytest` (the console script does not add the CWD to sys.path).
pythonpath = .
testpaths = tests
# Goal 12: opt-in LIVE whisperx==3.8.6 integration (needs isolated env +
# model weights + real audio). Skipped by default; reported as outstanding.
markers =
    live_whisperx: opt-in live WhisperX 3.8.6 end-to-end provider integration
