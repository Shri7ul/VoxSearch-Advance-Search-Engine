[pytest]
# Make the backend/ directory importable so `import app.*` resolves when
# running `pytest` (the console script does not add the CWD to sys.path).
pythonpath = .
testpaths = tests
# Goal 12: opt-in LIVE whisperx==3.8.6 integration (needs isolated env +
# model weights + real audio). Skipped by default; reported as outstanding.
# Goal 15: opt-in LIVE BGE-M3 real-weights embedding (needs the isolated
# .venv-embedding interpreter + cached weights). Skipped by default.
# Goal 16: opt-in LIVE PostgreSQL + pgvector integration (needs a dedicated
# local/test server with the vector extension). Skipped by default; NOT
# VERIFIED in this environment (no local instance available).
markers =
    live_whisperx: opt-in live WhisperX 3.8.6 end-to-end provider integration
    live_embedding: opt-in live BGE-M3 real-weights embedding integration
    live_pgvector: opt-in live PostgreSQL + pgvector integration (NOT VERIFIED here)
